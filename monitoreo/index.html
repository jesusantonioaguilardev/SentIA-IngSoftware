<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SentIA · Software de monitoreo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- GUI-0.1 Inicio de sesión del psicólogo -->
  <section id="vista-login" class="login" hidden>
    <form id="form-login" class="tarjeta login-caja" novalidate>
      <div class="logo grande"><span class="logo-icono">S</span> SentIA</div>
      <p class="sub">Software de monitoreo para el psicólogo</p>
      <label>Correo <span class="req">*</span>
        <input id="login-correo" type="email" autocomplete="username" value="christian.martinez@correo.com" required>
      </label>
      <label>Contraseña <span class="req">*</span>
        <input id="login-contrasena" type="password" autocomplete="current-password" minlength="8" required>
      </label>
      <p id="login-error" class="error" role="alert"></p>
      <button class="btn primario ancho" type="submit">Iniciar sesión</button>
      <p class="ayuda">Prototipo · contraseña de demo: <code>SentIA2026!</code></p>
      <p class="ayuda"><a href="/descargar-app">Descargar la app del paciente (Android)</a></p>
    </form>
  </section>

  <div id="vista-app" class="app" hidden>
    <aside class="menu">
      <div class="logo"><span class="logo-icono">S</span> SentIA</div>
      <nav>
        <a href="#/panel" data-ruta="panel"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg><span>Panel de monitoreo</span> <span id="badge-alertas" class="badge" hidden></span></a>
        <a href="#/pacientes" data-ruta="pacientes"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Pacientes</span></a>
        <a href="#/asignar" data-ruta="asignar"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg><span>Asignar instrumento</span></a>
        <a href="#/resultados" data-ruta="resultados"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg><span>Resultados clínicos</span> <span id="badge-resultados" class="badge naranja" hidden></span></a>
        <a href="#/reportes" data-ruta="reportes"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg><span>Reportes</span></a>
        <a href="#/bitacora" data-ruta="bitacora"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg><span>Bitácora</span></a>
      </nav>
      <p class="menu-pie">Prototipo semifuncional · Equipo #1</p>
    </aside>
    <main>
      <header class="barra">
        <h1 id="titulo">Panel de monitoreo</h1>
        <div class="usuario"><span id="nombre-usuario"></span> <button id="btn-salir" class="btn texto con-ico"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>Cerrar sesión</button></div>
      </header>
      <div id="contenido" class="contenido"></div>
    </main>
  </div>

  <!-- S-01 Alerta de peligro / GUI-1.2 Atender alerta -->
  <div id="modal" class="modal-fondo" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <div id="modal-cuerpo"></div>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
